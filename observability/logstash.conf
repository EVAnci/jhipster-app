
input {
  beats {
    port => 5044
  }
}

filter {
  json {
    source => "message"
    target => "parsed"
    tag_on_failure => ["_jsonparsefailure"]
  }

  if "_jsonparsefailure" in [tags] {
    drop {}
  }

  date {
    match => ["[parsed][@timestamp]", "ISO8601"]
    target => "@timestamp"
  }

  mutate {
    rename => {
      "[parsed][level]" => "level"
      "[parsed][logger_name]" => "logger_name"
      "[parsed][message]" => "message"
    }

    add_field => {
      "application" => "gestionlogs"
    }

    remove_field => [
      "parsed",
      "[event][original]"
    ]
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "jhipster-logs-%{+YYYY.MM.dd}"
    ilm_enabled => false
  }
}
